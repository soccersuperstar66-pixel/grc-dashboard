kind = "web"
previewPath = "/"
title = "Regulatory Tracking Dashboard"
version = "1.0.0"
id = "artifacts/grc-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22042

[services.development]
run = "pnpm --filter @workspace/grc-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/grc-dashboard", "run", "build" ]
publicDir = "artifacts/grc-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22042"
BASE_PATH = "/"
